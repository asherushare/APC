version: '3.8'

services:
  apc-postgres-prod:
    image: postgres:15-alpine
    container_name: apc-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-apc_db}
    # Exposing DB port 5432 publicly on the host is disabled for production security.
    # The backend container connects internally via the Docker bridge network.
    volumes:
      - apc-db-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  apc-backend-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apc-backend-prod
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@apc-postgres-prod:5432/${POSTGRES_DB:-apc_db}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET}
      WHATSAPP_ADMIN_NUMBER: ${WHATSAPP_ADMIN_NUMBER}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      apc-postgres-prod:
        condition: service_healthy

volumes:
  apc-db-prod-data:
